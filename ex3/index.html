<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Web Output #3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Javascript Web Output #3</h1>

    <button type="button" id="loadButton">Load data from the API</button>
    <button type="button" id="clearButton">Clear Table</button>

    <p>API: <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank" rel="noopener">
        https://jsonplaceholder.typicode.com/todos/</a></p>

    <p id="status" aria-live="polite"></p>

    <table id="todoTable">
        <thead>
            <tr>
                <th>User ID</th>
                <th>ID</th>
                <th>Title</th>
                <th>Completed</th>
            </tr>
        </thead>
        <tbody id="todoTableBody"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
